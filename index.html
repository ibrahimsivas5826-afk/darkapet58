<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Yönetim Paneli</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }

        /* Gizleme Sınıfı */
        .hidden {
            display: none !important;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            transition: border 0.3s;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .btn-danger {
            background-color: #dc3545;
            margin-top: 15px;
        }

        .btn-danger:hover {
            background-color: #bd2130;
        }

        .error-msg {
            color: #dc3545;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
        }

        /* Admin Dashboard Stilleri */
        .admin-dashboard {
            max-width: 800px;
        }

        .welcome-card {
            background: #e9ecef;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- 1. GİRİŞ FORMU (Giriş yapılmadıysa varsayılan olarak bu görünür) -->
    <div id="login-section" class="container">
        <h2>Admin Girişi</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Kullanıcı Adı</label>
                <input type="text" id="username" placeholder="Kullanıcı adınızı girin" required>
            </div>
            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" placeholder="Şifrenizi girin" required>
            </div>
            <button type="submit">Giriş Yap</button>
            <div id="error-message" class="error-msg"></div>
        </form>
    </div>

    <!-- 2. ADMIN PANELİ (Yetkisiz kullanıcılara kesinlikle gösterilmez) -->
    <div id="admin-section" class="container admin-dashboard hidden">
        <h2>🔒 Güvenli Admin Paneli</h2>
        <p>Tebrikler! Yetkili kullanıcı olarak oturum açtınız.</p>
        
        <div class="welcome-card">
            <h3>Sistem Durumu: Güvenli</h3>
            <p>GitHub linkine direkt tıklayan yetkisiz kişiler bu ekranı göremez, doğrudan giriş ekranına yönlendirilir.</p>
        </div>

        <button id="logout-btn" class="btn-danger">Oturumu Kapat</button>
    </div>

    <script>
        // DOM Elemanları
        const loginSection = document.getElementById('login-section');
        const adminSection = document.getElementById('admin-section');
        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        const logoutBtn = document.getElementById('logout-btn');

        // Sayfa Yüklendiğinde Oturum Kontrolü Yap
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
        });

        // Oturum Durumunu Kontrol Eden Fonksiyon
        function checkAuth() {
            // Tarayıcı hafızasındaki (localStorage/sessionStorage) Yetki Token'ını kontrol et
            const authToken = sessionStorage.getItem('admin_session_token');

            // Gerçek projede bu token Backend (Sunucu) tarafında doğrulanmalıdır!
            if (authToken === 'SECURE_ADMIN_TOKEN_98765') {
                showAdminPanel();
            } else {
                showLoginForm();
            }
        }

        // Giriş Formu Gönderildiğinde
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // ÖRNEK KONTROL (Gerçek uygulamada API isteği / Fetch ile sunucuya sorulmalıdır)
            if (username === "admin" && password === "123456") {
                // Başarılı giriş: Oturum Token'ı oluştur ve sakla
                sessionStorage.setItem('admin_session_token', 'SECURE_ADMIN_TOKEN_98765');
                errorMessage.textContent = "";
                checkAuth(); // Paneli yükle
            } else {
                errorMessage.textContent = "Hatalı kullanıcı adı veya şifre!";
            }
        });

        // Çıkış Yap Butonu
        logoutBtn.addEventListener('click', () => {
            // Oturum token'ını sil ve sayfayı yenile / giriş ekranına dön
            sessionStorage.removeItem('admin_session_token');
            checkAuth();
        });

        // Arayüz Değiştiriciler
        function showAdminPanel() {
            loginSection.classList.add('hidden');
            adminSection.classList.remove('hidden');
        }

        function showLoginForm() {
            adminSection.classList.add('hidden');
            loginSection.classList.remove('hidden');
        }
    </script>
</body>
</html>
